name: Bluesky Romania Streaming Bot

on:
  schedule:
    # Dimineața (aprox. 07:18, 08:33, 09:47 ora României)
    - cron: '18 5 * * *'
    - cron: '33 6 * * *'
    - cron: '47 7 * * *'
    # Prânz (aprox. 14:22 ora României)
    - cron: '22 12 * * *'
    # Seara (aprox. 19:08, 20:12 ora României)
    - cron: '8 17 * * *'
    - cron: '12 18 * * *'

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python bot.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_movies.json
          git commit -m "Update posted movies state [skip ci]" || echo "Nicio schimbare de salvat."
          git push
